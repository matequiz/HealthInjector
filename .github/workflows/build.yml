name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen và ldid
        run: brew install xcodegen ldid

      - name: Tạo project Xcode
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild -project HealthInjector.xcodeproj \
            -scheme HealthInjector \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói IPA (gắn entitlements HealthKit)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HealthInjector.app Payload/
          ldid -SHealthInjector/HealthInjector.entitlements Payload/HealthInjector.app/HealthInjector
          zip -qr HealthInjector.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HealthInjector-ipa
          path: HealthInjector.ipa
